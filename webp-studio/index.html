<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebP Studio · Batch Editor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "e1-pink": "#FF6B95",
                        "e1-orange": "#FF8C42",
                        "e1-green": "#00E676",
                        "e1-blue": "#2979FF",
                        "e1-dark": "#1e293b",
                        "e1-chalk": "#f8fafc",
                    },
                    fontFamily: {
                        headings: ["Fredoka", "sans-serif"],
                        body: ["Nunito", "sans-serif"],
                    },
                    boxShadow: {
                        neo: "4px 4px 0px 0px rgba(30, 41, 59, 1)",
                        "neo-sm": "2px 2px 0px 0px rgba(30, 41, 59, 1)",
                        "neo-pressed": "inset 4px 4px 0px 0px rgba(30, 41, 59, 0.2)",
                    },
                    borderWidth: { 3: "3px", 4: "4px" },
                },
            },
        };
    </script>

    <style>
        body {
            background-color: #f8fafc;
        }

        .dark body {
            background-color: #0f172a;
        }

        /* Brutalist Range Sliders */
        input[type="range"] {
            -webkit-appearance: none;
            background: transparent;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #FF8C42;
            border: 3px solid #1e293b;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 2px 2px 0px 0px rgba(30, 41, 59, 1);
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #cbd5e1;
            border: 2px solid #1e293b;
            border-radius: 4px;
        }

        .mode-active {
            background-color: #FF6B95 !important;
            color: #1e293b !important;
            box-shadow: inset 3px 3px 0px rgba(0,0,0,0.2) !important;
        }

        .canvas-checker {
            background: repeating-conic-gradient(#e2e8f0 0% 25%, #f8fafc 0% 50%) 50% / 20px 20px;
            border: 3px solid #1e293b;
            border-radius: 0.5rem;
        }
    </style>
</head>

<body class="font-body text-e1-dark flex flex-col min-h-screen transition-colors duration-200">

    <nav class="w-full bg-e1-pink border-b-4 border-e1-dark p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="../index.html"
                    class="bg-white text-e1-dark p-2 rounded-xl border-3 border-e1-dark shadow-neo hover:-translate-y-1 transition-transform"
                    title="Back">
                    <i data-lucide="arrow-left" class="w-6 h-6 border-e1-dark"></i>
                </a>
                <div class="flex items-center gap-3">
                    <div class="bg-white p-2 rounded-xl border-3 border-e1-dark shadow-neo-sm">
                        <i data-lucide="layers" class="text-e1-blue w-6 h-6"></i>
                    </div>
                    <h1 class="font-headings text-2xl font-bold tracking-wide text-white drop-shadow-md" style="-webkit-text-stroke: 1px #1e293b;">
                        WebP Studio <span class="text-e1-chalk opacity-90">Batch</span>
                    </h1>
                </div>
            </div>
            <button onclick="toggleDarkMode()"
                class="bg-e1-orange text-e1-dark p-2 rounded-xl border-3 border-e1-dark shadow-neo hover:-translate-y-1 transition-transform"
                title="Toggle Dark Mode">
                <i data-lucide="moon" class="w-6 h-6"></i>
            </button>
        </div>
    </nav>

    <main class="flex-grow max-w-6xl mx-auto w-full p-4 lg:p-8 flex flex-col lg:flex-row gap-8">

        <aside class="w-full lg:w-1/3 flex flex-col gap-6">

            <div class="bg-white p-6 rounded-2xl border-4 border-e1-dark shadow-neo relative overflow-hidden">
                <div class="absolute top-0 right-0 bg-e1-green text-e1-dark font-headings font-bold px-3 py-1 border-b-4 border-l-4 border-e1-dark rounded-bl-xl z-20">
                    Step 1
                </div>
                <h2 class="font-headings text-xl font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="upload-cloud" class="w-6 h-6 text-e1-blue"></i>
                    Load Images
                </h2>

                <div class="border-4 border-dashed border-slate-300 rounded-xl bg-slate-50 h-28 flex flex-col items-center justify-center cursor-pointer hover:bg-slate-100 hover:border-e1-blue transition-colors relative group">
                    <input type="file" id="fileInput" accept="image/*" multiple
                        class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                    <div class="flex flex-col items-center gap-2 group-hover:scale-105 transition-transform">
                        <i data-lucide="images" class="w-8 h-8 text-slate-400"></i>
                        <span class="font-bold text-slate-500">Select multiple images</span>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl border-4 border-e1-dark shadow-neo relative opacity-50 pointer-events-none transition-all duration-300"
                id="configCard">
                <div class="absolute top-0 right-0 bg-e1-orange text-e1-dark font-headings font-bold px-3 py-1 border-b-4 border-l-4 border-e1-dark rounded-bl-xl">
                    Step 2
                </div>
                <h2 class="font-headings text-xl font-bold mb-6 flex items-center gap-2">
                    <i data-lucide="sliders" class="w-6 h-6 text-e1-pink"></i>
                    Transform & Export
                </h2>

                <div class="mb-6">
                    <div class="flex items-center gap-2 mb-2">
                        <div class="w-2 h-2 rounded-full bg-e1-blue"></div>
                        <p class="font-headings font-semibold text-lg">Rotation</p>
                    </div>
                    <div class="flex gap-2 mb-3 flex-wrap">
                        <button id="rotateLeft" class="bg-e1-chalk border-3 border-e1-dark px-3 py-2 rounded-xl font-bold shadow-neo-sm hover:-translate-y-1 transition-transform flex items-center gap-1"><i data-lucide="rotate-ccw" class="w-4 h-4"></i>-90°</button>
                        <button id="rotateRight" class="bg-e1-chalk border-3 border-e1-dark px-3 py-2 rounded-xl font-bold shadow-neo-sm hover:-translate-y-1 transition-transform flex items-center gap-1"><i data-lucide="rotate-cw" class="w-4 h-4"></i>+90°</button>
                        <button id="rotate180" class="bg-e1-chalk border-3 border-e1-dark px-3 py-2 rounded-xl font-bold shadow-neo-sm hover:-translate-y-1 transition-transform flex items-center gap-1"><i data-lucide="rotate-3d" class="w-4 h-4"></i>180°</button>
                        <button id="rotateReset" class="bg-e1-chalk border-3 border-e1-dark px-3 py-2 rounded-xl font-bold shadow-neo-sm hover:-translate-y-1 transition-transform flex items-center gap-1"><i data-lucide="x" class="w-4 h-4"></i>Reset</button>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-bold text-slate-500 w-8">0°</span>
                        <input type="range" id="rotationSlider" min="0" max="360" value="0" step="1" class="w-full" />
                        <span class="text-sm font-bold text-slate-500 w-10 text-right">360°</span>
                    </div>
                </div>

                <div class="mb-6">
                    <div class="flex items-center gap-2 mb-2">
                        <div class="w-2 h-2 rounded-full bg-e1-pink"></div>
                        <p class="font-headings font-semibold text-lg">Flip</p>
                    </div>
                    <div class="flex gap-3">
                        <button id="flipH" class="flex-1 bg-white border-3 border-e1-dark py-2 rounded-xl font-bold shadow-neo hover:-translate-y-1 transition-transform">Horizontal</button>
                        <button id="flipV" class="flex-1 bg-white border-3 border-e1-dark py-2 rounded-xl font-bold shadow-neo hover:-translate-y-1 transition-transform">Vertical</button>
                    </div>
                </div>

                <div class="mb-6">
                    <div class="flex items-center gap-2 mb-2">
                        <div class="w-2 h-2 rounded-full bg-e1-green"></div>
                        <p class="font-headings font-semibold text-lg">Crop <span class="text-sm font-normal text-slate-400">(Ref: First Image)</span></p>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-600 mb-1">Left</label>
                            <input type="range" id="cropXSlider" min="0" max="100" value="0" class="w-full" />
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-600 mb-1">Top</label>
                            <input type="range" id="cropYSlider" min="0" max="100" value="0" class="w-full" />
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-600 mb-1">Width</label>
                            <input type="range" id="cropWSlider" min="1" max="100" value="100" class="w-full" />
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-600 mb-1">Height</label>
                            <input type="range" id="cropHSlider" min="1" max="100" value="100" class="w-full" />
                        </div>
                    </div>
                    <button id="resetCrop" class="w-full mt-4 bg-e1-chalk border-3 border-e1-dark py-2 rounded-xl font-bold shadow-neo-sm hover:-translate-y-1 transition-transform flex items-center justify-center gap-2">
                        <i data-lucide="maximize" class="w-4 h-4"></i>Reset Crop
                    </button>
                </div>

                <div class="mb-6 bg-slate-50 p-4 rounded-xl border-3 border-e1-dark">
                    <div class="flex items-center gap-2 mb-3">
                        <input type="checkbox" id="resizeEnable" class="w-5 h-5 accent-e1-blue border-2 border-e1-dark rounded cursor-pointer" />
                        <span class="font-headings font-bold text-lg cursor-pointer" onclick="document.getElementById('resizeEnable').click()">Enable Resize</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-600 mb-1">Max W: <span id="maxWidthVal" class="text-e1-blue">800</span>px</label>
                            <input type="range" id="maxWidthSlider" min="100" max="2000" value="800" class="w-full" />
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-600 mb-1">Max H: <span id="maxHeightVal" class="text-e1-blue">600</span>px</label>
                            <input type="range" id="maxHeightSlider" min="100" max="2000" value="600" class="w-full" />
                        </div>
                    </div>
                </div>

                <hr class="my-6 border-slate-300" />

                <div class="mb-6">
                    <div class="flex items-center gap-2 mb-2">
                        <div class="w-2 h-2 rounded-full bg-e1-orange"></div>
                        <p class="font-headings font-semibold text-lg">Batch Renaming</p>
                    </div>
                    <input type="text" id="batchPrefix" placeholder="Base filename (e.g. lesson_asset)" class="w-full bg-white border-3 border-e1-dark px-4 py-3 rounded-xl font-bold shadow-neo-sm focus:outline-none focus:ring-4 focus:ring-e1-orange/30 transition-shadow" />
                    <p id="batchStatus" class="font-bold text-slate-500 mt-2">0 images ready</p>
                </div>

                <button id="downloadBtn" class="w-full mt-2 bg-e1-green text-e1-dark font-headings font-bold text-xl py-4 px-4 rounded-xl border-4 border-e1-dark shadow-neo hover:-translate-y-1 active:translate-y-1 active:shadow-none transition-all flex items-center justify-center gap-2 group disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <i data-lucide="download" class="w-6 h-6"></i>
                    Process & Download All
                </button>
                <p id="statusMsg" class="text-center font-bold text-e1-pink mt-3 h-4"></p>
            </div>
        </aside>

        <section class="w-full lg:w-2/3">
            <div class="bg-white p-3 rounded-2xl border-4 border-e1-dark shadow-neo h-full min-h-[500px] flex flex-col relative">
                <div class="absolute top-6 left-6 z-10 bg-white border-3 border-e1-dark px-4 py-2 rounded-xl shadow-neo-sm">
                    <h2 class="font-headings font-bold flex items-center gap-2 text-e1-dark">
                        <i data-lucide="eye" class="text-e1-blue w-5 h-5"></i>
                        Preview <span class="text-sm font-normal text-slate-500 ml-1">(First Image)</span>
                    </h2>
                </div>

                <div class="flex-grow canvas-checker flex items-center justify-center overflow-hidden relative m-1 p-4" id="previewContainer">
                    <div id="emptyState" class="text-center p-6 bg-white border-3 border-dashed border-slate-300 rounded-2xl shadow-sm">
                        <div class="inline-flex items-center justify-center bg-slate-50 w-20 h-20 rounded-full border-3 border-slate-200 mb-4">
                            <i data-lucide="layout-grid" class="w-10 h-10 text-slate-400"></i>
                        </div>
                        <p class="text-slate-500 font-bold text-lg">Waiting for images...</p>
                    </div>
                    <canvas id="mainCanvas" class="hidden shadow-neo border-3 border-e1-dark relative z-10 max-w-full max-h-full object-contain rounded-lg"></canvas>
                </div>

                <div class="flex justify-between font-bold text-slate-500 mt-3 px-2 bg-slate-50 p-2 rounded-xl border-2 border-slate-200">
                    <span>Original: <span id="origDim" class="text-e1-dark">—</span></span>
                    <span>Output: <span id="outDim" class="text-e1-blue">—</span></span>
                </div>
            </div>
        </section>
    </main>

    <script>
        (function () {
            lucide.createIcons();

            // DOM elements
            const fileInput = document.getElementById('fileInput');
            const configCard = document.getElementById('configCard');
            const emptyState = document.getElementById('emptyState');
            const mainCanvas = document.getElementById('mainCanvas');
            const ctx = mainCanvas.getContext('2d');
            const downloadBtn = document.getElementById('downloadBtn');
            const statusMsg = document.getElementById('statusMsg');
            const origDim = document.getElementById('origDim');
            const outDim = document.getElementById('outDim');
            const batchStatus = document.getElementById('batchStatus');
            const batchPrefix = document.getElementById('batchPrefix');

            // Controls
            const rotationSlider = document.getElementById('rotationSlider');
            const flipH = document.getElementById('flipH');
            const flipV = document.getElementById('flipV');
            const cropXSlider = document.getElementById('cropXSlider');
            const cropYSlider = document.getElementById('cropYSlider');
            const cropWSlider = document.getElementById('cropWSlider');
            const cropHSlider = document.getElementById('cropHSlider');
            const resizeEnable = document.getElementById('resizeEnable');
            const maxWidthSlider = document.getElementById('maxWidthSlider');
            const maxHeightSlider = document.getElementById('maxHeightSlider');

            // State
            let uploadedFiles = [];
            let originalImage = null;
            let originalWidth = 0, originalHeight = 0;
            let rotation = 0;
            let flipHorizontal = false;
            let flipVertical = false;

            // Update UI helpers
            function updateCropSliderRanges() {
                if (!originalImage) return;
                cropXSlider.max = originalWidth;
                cropYSlider.max = originalHeight;
                cropWSlider.max = originalWidth - parseInt(cropXSlider.value);
                cropHSlider.max = originalHeight - parseInt(cropYSlider.value);
                if (parseInt(cropWSlider.value) > cropWSlider.max) cropWSlider.value = cropWSlider.max;
                if (parseInt(cropHSlider.value) > cropHSlider.max) cropHSlider.value = cropHSlider.max;
            }

            function syncResizeSliders() {
                document.getElementById('maxWidthVal').textContent = maxWidthSlider.value;
                document.getElementById('maxHeightVal').textContent = maxHeightSlider.value;
            }

            function renderPreview() {
                if (!originalImage) return;

                let srcX = parseInt(cropXSlider.value);
                let srcY = parseInt(cropYSlider.value);
                let srcW = parseInt(cropWSlider.value);
                let srcH = parseInt(cropHSlider.value);

                srcX = Math.max(0, Math.min(srcX, originalWidth - 1));
                srcY = Math.max(0, Math.min(srcY, originalHeight - 1));
                srcW = Math.max(1, Math.min(srcW, originalWidth - srcX));
                srcH = Math.max(1, Math.min(srcH, originalHeight - srcY));

                let baseW = (rotation % 180 !== 0) ? srcH : srcW;
                let baseH = (rotation % 180 !== 0) ? srcW : srcH;
                let outW = baseW, outH = baseH;

                if (resizeEnable.checked) {
                    const maxW = parseInt(maxWidthSlider.value);
                    const maxH = parseInt(maxHeightSlider.value);
                    const scale = Math.min(maxW / baseW, maxH / baseH, 1);
                    outW = Math.round(baseW * scale);
                    outH = Math.round(baseH * scale);
                }

                mainCanvas.width = outW;
                mainCanvas.height = outH;

                ctx.clearRect(0, 0, outW, outH);
                ctx.save();
                ctx.translate(outW / 2, outH / 2);
                ctx.rotate(rotation * Math.PI / 180);
                ctx.scale(flipHorizontal ? -1 : 1, flipVertical ? -1 : 1);
                ctx.drawImage(originalImage, srcX, srcY, srcW, srcH, -outW / 2, -outH / 2, outW, outH);
                ctx.restore();

                outDim.textContent = `${outW} x ${outH}`;
            }

            // Image Loaders
            function loadImageAsPromise(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const img = new Image();
                        img.onload = () => resolve(img);
                        img.onerror = reject;
                        img.src = evt.target.result;
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

            async function handleUpload(e) {
                const files = e.target.files;
                if (!files || files.length === 0) return;

                uploadedFiles = Array.from(files);
                batchStatus.innerText = `${uploadedFiles.length} image(s) ready in queue`;

                originalImage = await loadImageAsPromise(uploadedFiles[0]);
                originalWidth = originalImage.width;
                originalHeight = originalImage.height;
                origDim.textContent = `${originalWidth} x ${originalHeight}`;

                configCard.classList.remove('opacity-50', 'pointer-events-none');
                emptyState.classList.add('hidden');
                mainCanvas.classList.remove('hidden');
                downloadBtn.disabled = false;

                rotation = 0; rotationSlider.value = 0;
                flipHorizontal = false; flipVertical = false;
                flipH.classList.remove('mode-active'); flipV.classList.remove('mode-active');

                cropXSlider.value = 0; cropYSlider.value = 0;
                cropWSlider.value = originalWidth; cropHSlider.value = originalHeight;

                maxWidthSlider.max = Math.max(2000, originalWidth * 2);
                maxHeightSlider.max = Math.max(2000, originalHeight * 2);
                resizeEnable.checked = false;

                updateCropSliderRanges();
                syncResizeSliders();
                renderPreview();
            }

            fileInput.addEventListener('change', handleUpload);

            // Event Listeners (Transforms)
            document.getElementById('rotateLeft').onclick = () => { rotation = (rotation - 90 + 360) % 360; rotationSlider.value = rotation; renderPreview(); };
            document.getElementById('rotateRight').onclick = () => { rotation = (rotation + 90) % 360; rotationSlider.value = rotation; renderPreview(); };
            document.getElementById('rotate180').onclick = () => { rotation = (rotation + 180) % 360; rotationSlider.value = rotation; renderPreview(); };
            document.getElementById('rotateReset').onclick = () => { rotation = 0; rotationSlider.value = 0; renderPreview(); };
            rotationSlider.oninput = (e) => { rotation = parseInt(e.target.value); renderPreview(); };

            flipH.onclick = () => { flipHorizontal = !flipHorizontal; flipH.classList.toggle('mode-active', flipHorizontal); renderPreview(); };
            flipV.onclick = () => { flipVertical = !flipVertical; flipV.classList.toggle('mode-active', flipVertical); renderPreview(); };

            cropXSlider.oninput = () => { updateCropSliderRanges(); renderPreview(); };
            cropYSlider.oninput = () => { updateCropSliderRanges(); renderPreview(); };
            cropWSlider.oninput = renderPreview;
            cropHSlider.oninput = renderPreview;
            document.getElementById('resetCrop').onclick = () => {
                cropXSlider.value = 0; cropYSlider.value = 0;
                cropWSlider.max = originalWidth; cropHSlider.max = originalHeight;
                cropWSlider.value = originalWidth; cropHSlider.value = originalHeight;
                renderPreview();
            };

            resizeEnable.onchange = renderPreview;
            maxWidthSlider.oninput = () => { syncResizeSliders(); renderPreview(); };
            maxHeightSlider.oninput = () => { syncResizeSliders(); renderPreview(); };

            // Batch Download Logic
            downloadBtn.addEventListener('click', async () => {
                if (uploadedFiles.length === 0) return;

                downloadBtn.disabled = true;
                const prefix = batchPrefix.value.trim() || 'image';

                for (let i = 0; i < uploadedFiles.length; i++) {
                    statusMsg.innerText = `Processing ${i + 1} of ${uploadedFiles.length}...`;
                    const file = uploadedFiles[i];
                    const img = await loadImageAsPromise(file);

                    let srcX = Math.min(parseInt(cropXSlider.value), Math.max(0, img.width - 1));
                    let srcY = Math.min(parseInt(cropYSlider.value), Math.max(0, img.height - 1));
                    let srcW = Math.min(parseInt(cropWSlider.value), img.width - srcX);
                    let srcH = Math.min(parseInt(cropHSlider.value), img.height - srcY);

                    let baseW = (rotation % 180 !== 0) ? srcH : srcW;
                    let baseH = (rotation % 180 !== 0) ? srcW : srcH;
                    let outW = baseW, outH = baseH;

                    if (resizeEnable.checked) {
                        const maxW = parseInt(maxWidthSlider.value);
                        const maxH = parseInt(maxHeightSlider.value);
                        const scale = Math.min(maxW / baseW, maxH / baseH, 1);
                        outW = Math.round(baseW * scale);
                        outH = Math.round(baseH * scale);
                    }

                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = outW;
                    tempCanvas.height = outH;
                    const tCtx = tempCanvas.getContext('2d');

                    tCtx.translate(outW / 2, outH / 2);
                    tCtx.rotate(rotation * Math.PI / 180);
                    tCtx.scale(flipHorizontal ? -1 : 1, flipVertical ? -1 : 1);
                    tCtx.drawImage(img, srcX, srcY, srcW, srcH, -outW / 2, -outH / 2, outW, outH);

                    await new Promise((resolve) => {
                        tempCanvas.toBlob((blob) => {
                            if (blob) {
                                const url = URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.href = url;
                                a.download = `${prefix}_${i + 1}.webp`;
                                document.body.appendChild(a);
                                a.click();
                                document.body.removeChild(a);
                                URL.revokeObjectURL(url);
                            }
                            resolve();
                        }, 'image/webp', 0.92);
                    });

                    // 300ms delay to prevent the browser from blocking sequential downloads
                    await new Promise(r => setTimeout(r, 300));
                }

                statusMsg.innerText = 'Batch export complete!';
                setTimeout(() => (statusMsg.innerText = ''), 4000);
                downloadBtn.disabled = false;
            });

            window.toggleDarkMode = () => document.documentElement.classList.toggle('dark');
            window.addEventListener('resize', () => { if (originalImage) renderPreview(); });
        })();
    </script>
</body>

</html>
