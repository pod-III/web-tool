<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Generator - English 1 Batam</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'e1-pink': '#FF6B95',
                        'e1-orange': '#FF8C42',
                        'e1-green': '#00E676',
                        'e1-blue': '#2979FF',
                        'e1-purple': '#9C27B0',
                        'e1-dark': '#1e293b',
                        'e1-chalk': '#f8fafc',
                    },
                    fontFamily: {
                        headings: ['Fredoka', 'sans-serif'],
                        body: ['Nunito', 'sans-serif'],
                    },
                    boxShadow: {
                        'neo': '4px 4px 0px 0px rgba(30, 41, 59, 1)',
                        'neo-sm': '2px 2px 0px 0px rgba(30, 41, 59, 1)',
                    },
                    borderWidth: { '3': '3px', '4': '4px' }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
            transition: background-color 0.3s ease;
        }
        
        /* Dark Mode Body Override */
        .dark body {
            background-color: #0f172a; /* slate-900 */
            background-image: radial-gradient(#334155 1px, transparent 1px);
        }

        .btn-neo { transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-neo:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 4px 4px 0px 0px rgba(30, 41, 59, 1); }
        .btn-neo:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 0px 0px 0px 0px rgba(30, 41, 59, 1); }
        
        .dark .btn-neo:hover:not(:disabled) { box-shadow: 4px 4px 0px 0px #000000; }
        .dark .btn-neo:active:not(:disabled) { box-shadow: 0px 0px 0px 0px #000000; }

        .option-card { transition: all 0.15s ease-in-out; }
        .option-card:hover:not(.selected) { transform: translate(-2px, -2px); box-shadow: 4px 4px 0px 0px rgba(30, 41, 59, 1); border-color: #2979FF; }
        .dark .option-card:hover:not(.selected) { box-shadow: 4px 4px 0px 0px #000000; border-color: #2979FF; }
        
        .option-card.selected { 
            background-color: #1e293b; 
            color: white; 
            border-color: #1e293b;
            transform: translate(2px, 2px); 
            box-shadow: 0px 0px 0px 0px rgba(30, 41, 59, 1);
        }
        .dark .option-card.selected {
            background-color: #334155;
            border-color: #475569;
        }

        .level-tab { transition: all 0.15s ease; }
        .level-tab.active { background-color: #1e293b; color: white; border-color: #1e293b; box-shadow: none; }
        .dark .level-tab.active { background-color: #334155; border-color: #475569; }
        
        .level-tab:not(.active):hover { background-color: #e2e8f0; color: #1e293b; }
        .dark .level-tab:not(.active):hover { background-color: #475569; color: white; }

        .accordion-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .accordion-content.open { grid-template-rows: 1fr; }
        .accordion-inner { overflow: hidden; }
        
        .chevron { transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .chevron.open { transform: rotate(180deg); }

        /* Smooth Scrollbar */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: transparent; border-left: 3px solid #1e293b; }
        .dark ::-webkit-scrollbar-track { border-left-color: #334155; }
        ::-webkit-scrollbar-thumb { background: #2979FF; border: 3px solid #1e293b; border-right: none; }
        .dark ::-webkit-scrollbar-thumb { border-color: #334155; }
        ::-webkit-scrollbar-thumb:hover { background: #FF6B95; }
        
        /* Utility class to keep shadows solid black even in dark mode for contrast */
        .dark .shadow-neo { box-shadow: 4px 4px 0px 0px #000000; }
        .dark .shadow-neo-sm { box-shadow: 2px 2px 0px 0px #000000; }
    </style>
    
    <script>
        // Check local storage for dark mode preference before page load to prevent flash
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>

<body class="font-body text-e1-dark dark:text-slate-200 h-screen flex flex-col overflow-hidden transition-colors duration-300">

    <header class="w-full bg-white/90 dark:bg-slate-900/90 backdrop-blur-sm border-b-4 border-e1-dark dark:border-slate-800 p-4 shadow-sm z-20 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-4">
            <div class="flex gap-2">
                <a href="../index.html" class="btn-neo bg-white dark:bg-slate-800 border-3 border-e1-dark dark:border-slate-700 rounded-xl p-2.5 text-slate-700 dark:text-slate-300 hover:text-e1-pink dark:hover:text-e1-pink shadow-neo-sm flex items-center justify-center group" title="Back to Dashboard">
                    <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-1 transition-transform"></i>
                </a>
                
                <button onclick="toggleTheme()" class="btn-neo bg-white dark:bg-slate-800 border-3 border-e1-dark dark:border-slate-700 rounded-xl p-2.5 text-slate-700 dark:text-slate-300 hover:text-e1-blue dark:hover:text-e1-blue shadow-neo-sm flex items-center justify-center" title="Toggle Theme">
                    <i data-lucide="sun" id="theme-icon-light" class="w-5 h-5 hidden dark:block"></i>
                    <i data-lucide="moon" id="theme-icon-dark" class="w-5 h-5 block dark:hidden"></i>
                </button>
            </div>

            <div class="h-10 w-1 bg-e1-dark/10 dark:bg-slate-700 rounded-full mx-1"></div> <div class="flex items-center gap-3">
                <div class="bg-e1-dark dark:bg-slate-800 text-white p-2 rounded-lg shadow-neo-sm border-2 border-transparent dark:border-slate-700">
                    <i data-lucide="file-check-2" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-headings text-2xl font-bold tracking-tight leading-none text-e1-dark dark:text-white">KlassKit <span class="text-e1-blue">Report Gen</span></h1>
                    <p class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mt-1">English 1 Batam</p>
                </div>
            </div>
        </div>
        
        <div class="flex gap-3 items-center bg-e1-chalk dark:bg-slate-800 p-2 rounded-xl border-3 border-e1-dark dark:border-slate-700 shadow-neo-sm">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i data-lucide="user" class="w-4 h-4 text-slate-400"></i>
                </div>
                <input type="text" id="studentName" class="w-48 pl-9 pr-3 py-2.5 bg-white dark:bg-slate-900 border-2 border-e1-dark dark:border-slate-600 rounded-lg font-bold placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-4 focus:ring-e1-blue/20 transition-all text-sm text-e1-dark dark:text-white" placeholder="Student Name" oninput="compileReport()">
            </div>
            
            <select id="pronoun" class="py-2.5 px-3 bg-white dark:bg-slate-900 border-2 border-e1-dark dark:border-slate-600 rounded-lg font-bold cursor-pointer focus:outline-none focus:ring-4 focus:ring-e1-blue/20 transition-all text-sm text-e1-dark dark:text-white" onchange="compileReport()">
                <option value="he">He / His</option>
                <option value="she">She / Her</option>
                <option value="they">They / Their</option>
            </select>
        </div>
    </header>

    <div class="flex flex-row h-full overflow-hidden">
        
        <div class="w-[55%] overflow-y-auto p-6 border-r-4 border-e1-dark dark:border-slate-800 bg-white/50 dark:bg-slate-900/50 pb-32" id="optionsContainer">
            <div id="loadingMsg" class="font-headings font-bold text-xl text-center text-slate-500 mt-20 flex flex-col items-center gap-4">
                <i data-lucide="loader-2" class="w-10 h-10 animate-spin text-e1-blue"></i>
                Loading comments.json...
            </div>
        </div>

        <div class="w-[45%] bg-e1-pink dark:bg-slate-800/80 p-6 flex flex-col relative h-full transition-colors">
            <div class="bg-white dark:bg-slate-900 border-4 border-e1-dark dark:border-slate-700 rounded-2xl p-6 shadow-neo flex flex-col h-full relative">
                
                <div class="flex justify-between items-center mb-4 pb-4 border-b-3 border-e1-dark/10 dark:border-slate-700">
                    <h2 class="font-headings font-bold text-xl flex items-center gap-2 text-e1-dark dark:text-white">
                        <i data-lucide="sparkles" class="w-5 h-5 text-e1-orange"></i> Compiled Text
                    </h2>
                    <div class="flex gap-2">
                        <button onclick="clearAll()" class="btn-neo bg-e1-chalk dark:bg-slate-800 border-3 border-e1-dark dark:border-slate-600 rounded-xl px-3 py-2 font-bold text-sm shadow-neo-sm flex items-center gap-2 text-slate-600 dark:text-slate-300 hover:text-e1-pink dark:hover:text-e1-pink">
                            <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reset
                        </button>
                        <button onclick="copyReport()" id="copyBtn" class="btn-neo bg-e1-green border-3 border-e1-dark dark:border-slate-600 rounded-xl px-4 py-2 font-bold text-sm shadow-neo-sm flex items-center gap-2 text-e1-dark">
                            <i data-lucide="copy" class="w-4 h-4"></i> Copy Text
                        </button>
                    </div>
                </div>

                <textarea id="outputReport" readonly class="w-full flex-grow bg-e1-chalk dark:bg-slate-800 border-3 border-e1-dark dark:border-slate-600 rounded-xl p-5 font-body text-[1.1rem] font-medium leading-relaxed text-slate-700 dark:text-slate-300 focus:outline-none resize-none shadow-inner transition-colors" placeholder="Select a skill level and sentence from the left panel to begin building the report..."></textarea>
                
                <div class="absolute bottom-4 right-8 bg-white dark:bg-slate-900 border-2 border-e1-dark dark:border-slate-600 px-4 py-1.5 rounded-full text-xs font-bold text-slate-500 dark:text-slate-400 shadow-neo-sm flex items-center gap-3">
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="bar-chart-2" class="w-3.5 h-3.5"></i>
                        <span id="wordCount" class="text-e1-dark dark:text-white text-sm">0</span> words
                    </div>
                    <div class="w-px h-3.5 bg-slate-300 dark:bg-slate-600"></div>
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="type" class="w-3.5 h-3.5"></i>
                        <span id="charCount" class="text-e1-dark dark:text-white text-sm">0</span> chars
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let commentBank = [];
        let state = {};
        let activeAccordion = 'general';

        const pronouns = {
            she: { subject: 'she', object: 'her', possessive: 'her', CapSubject: 'She', CapPossessive: 'Her' },
            he: { subject: 'he', object: 'him', possessive: 'his', CapSubject: 'He', CapPossessive: 'His' },
            they: { subject: 'they', object: 'them', possessive: 'their', CapSubject: 'They', CapPossessive: 'Their' }
        };

        // Theme Toggle Logic
        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        async function fetchComments() {
            try {
                const response = await fetch('comments.json');
                if (!response.ok) throw new Error('Network error');
                commentBank = await response.json();
                
                commentBank.forEach(cat => {
                    state[cat.id] = { level: 'good', selectionIndex: null };
                });

                document.getElementById('loadingMsg').style.display = 'none';
                renderAccordions();
                compileReport();
            } catch (error) {
                document.getElementById('loadingMsg').innerHTML = `<div class="text-red-500">Failed to load comments.json</div>`;
            }
        }

        function parseText(text, nameStr, pronounObj) {
            if(!text) return "";
            return text
                .replace(/\[Name\]/g, nameStr)
                .replace(/\[CapSubject\]/g, pronounObj.CapSubject)
                .replace(/\[subject\]/g, pronounObj.subject)
                .replace(/\[CapPossessive\]/g, pronounObj.CapPossessive)
                .replace(/\[possessive\]/g, pronounObj.possessive)
                .replace(/\[object\]/g, pronounObj.object);
        }

        function getTagColor(tag) {
            const colors = {
                'Grammar': 'bg-e1-purple', 'Vocab': 'bg-e1-pink', 'Speaking': 'bg-e1-orange', 
                'Listening': 'bg-e1-blue', 'Reading': 'bg-emerald-500', 'Writing': 'bg-teal-500', 
                'Phonics': 'bg-amber-400 text-e1-dark', 'Default': 'bg-slate-700'
            };
            return colors[tag] || colors['Default'];
        }

        function renderAccordions() {
            const container = document.getElementById('optionsContainer');
            container.innerHTML = ""; 

            commentBank.forEach((category, idx) => {
                const catState = state[category.id];
                const isOpen = activeAccordion === category.id;
                const hasSelection = catState.selectionIndex !== null;
                const numberPrefix = idx + 1;

                const section = document.createElement('div');
                section.className = `bg-white dark:bg-slate-800 border-4 border-e1-dark dark:border-slate-700 rounded-2xl mb-5 shadow-neo border-l-8 border-l-${category.theme.replace('kk-', 'e1-')} overflow-hidden`;

                const header = document.createElement('button');
                header.className = `w-full p-4 flex justify-between items-center text-left hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors ${hasSelection && !isOpen ? 'bg-slate-50 dark:bg-slate-800/80' : ''}`;
                header.onclick = () => {
                    activeAccordion = isOpen ? null : category.id; 
                    renderAccordions(); 
                };

                const titleWrapper = document.createElement('div');
                titleWrapper.className = "flex items-center gap-3";
                
                const numBadge = document.createElement('div');
                numBadge.className = `w-8 h-8 rounded-full flex items-center justify-center font-headings font-bold text-sm border-2 border-e1-dark dark:border-slate-600 transition-colors ${hasSelection ? 'bg-e1-green text-e1-dark dark:border-transparent' : 'bg-e1-chalk dark:bg-slate-900 text-slate-500 dark:text-slate-400'}`;
                numBadge.innerHTML = hasSelection ? `<i data-lucide="check" class="w-4 h-4"></i>` : numberPrefix;
                titleWrapper.appendChild(numBadge);
                
                const titleText = document.createElement('h3');
                titleText.className = `font-headings font-bold text-xl ${hasSelection ? 'text-e1-dark dark:text-white' : 'text-slate-600 dark:text-slate-300'}`;
                titleText.innerText = category.title.replace(/^\d+\.\s*/, '');
                titleWrapper.appendChild(titleText);
                
                header.appendChild(titleWrapper);

                const chevron = document.createElement('div');
                chevron.innerHTML = `<i data-lucide="chevron-down" class="w-6 h-6 text-slate-400 chevron ${isOpen ? 'open' : ''}"></i>`;
                header.appendChild(chevron);
                section.appendChild(header);

                const bodyWrapper = document.createElement('div');
                bodyWrapper.className = `accordion-content ${isOpen ? 'open' : ''}`;
                
                const bodyInner = document.createElement('div');
                bodyInner.className = "accordion-inner px-4 pb-4 flex flex-col gap-4";

                const levelNav = document.createElement('div');
                levelNav.className = "flex gap-2 bg-e1-chalk dark:bg-slate-900 p-1.5 rounded-xl border-3 border-e1-dark dark:border-slate-600 w-fit mt-2";
                
                const levels = [
                    { key: 'support', label: 'Needs Support' },
                    { key: 'good', label: 'Developing/Good' },
                    { key: 'excellent', label: 'Excellent' }
                ];

                levels.forEach(lvl => {
                    const btn = document.createElement('button');
                    btn.className = `level-tab px-4 py-1.5 rounded-lg text-sm font-bold font-headings border-2 border-transparent text-slate-500 dark:text-slate-400 cursor-pointer ${catState.level === lvl.key ? 'active' : ''}`;
                    btn.innerText = lvl.label;
                    
                    btn.onclick = (e) => {
                        e.stopPropagation(); 
                        state[category.id].level = lvl.key;
                        state[category.id].selectionIndex = null; 
                        renderAccordions();
                        compileReport();
                    };
                    levelNav.appendChild(btn);
                });
                bodyInner.appendChild(levelNav);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = "flex flex-col gap-3";
                
                const optionsArray = category.levels[catState.level];
                optionsArray.forEach((optItem, index) => {
                    let tag = null;
                    let rawText = optItem;

                    if (typeof optItem === 'string' && optItem.includes(' | ')) {
                        const parts = optItem.split(' | ');
                        tag = parts[0].trim();
                        rawText = parts[1].trim();
                    }

                    const btn = document.createElement('button');
                    const isSelected = catState.selectionIndex === index;
                    btn.className = `option-card text-left p-4 border-3 border-e1-dark dark:border-slate-600 rounded-xl bg-e1-chalk dark:bg-slate-900 font-semibold text-[0.95rem] cursor-pointer leading-relaxed flex flex-col gap-2 ${isSelected ? 'selected' : 'text-slate-600 dark:text-slate-300'}`;
                    
                    if (tag) {
                        const badgeColor = isSelected ? 'bg-white/20 text-white border-white/30' : `${getTagColor(tag)} text-white border-transparent`;
                        const tagHtml = `<span class="inline-block px-2.5 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider border-2 ${badgeColor}">${tag}</span>`;
                        btn.innerHTML = tagHtml;
                    }

                    const textSpan = document.createElement('span');
                    textSpan.innerText = parseText(rawText, "Student", pronouns.he);
                    btn.appendChild(textSpan);
                    
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        state[category.id].selectionIndex = index;
                        
                        if (idx < commentBank.length - 1) {
                            activeAccordion = commentBank[idx + 1].id;
                        } else {
                            activeAccordion = null; 
                        }
                        
                        renderAccordions(); 
                        compileReport();
                    };
                    
                    optionsGrid.appendChild(btn);
                });

                bodyInner.appendChild(optionsGrid);
                bodyWrapper.appendChild(bodyInner);
                section.appendChild(bodyWrapper);
                
                container.appendChild(section);
            });
            
            lucide.createIcons();
        }

        function compileReport() {
            let nameInput = document.getElementById('studentName').value.trim();
            if (!nameInput) nameInput = "[Name]";
            
            const pData = pronouns[document.getElementById('pronoun').value];
            let finalReportParts = [];

            commentBank.forEach(category => {
                const catState = state[category.id];
                if (catState && catState.selectionIndex !== null) {
                    let rawItem = category.levels[catState.level][catState.selectionIndex];
                    
                    if (typeof rawItem === 'string' && rawItem.includes(' | ')) {
                        rawItem = rawItem.split(' | ')[1].trim();
                    }
                    
                    const parsedSentence = parseText(rawItem, nameInput, pData);
                    finalReportParts.push(parsedSentence);
                }
            });

            const finalText = finalReportParts.join(" ");
            const outputArea = document.getElementById('outputReport');
            
            outputArea.value = finalText;
            
            if (finalReportParts.length === commentBank.length && finalReportParts.length > 0) {
                outputArea.classList.add('bg-white', 'text-e1-dark', 'dark:bg-slate-700', 'dark:text-white');
                outputArea.classList.remove('bg-e1-chalk', 'text-slate-700', 'dark:bg-slate-800', 'dark:text-slate-300');
            } else {
                outputArea.classList.add('bg-e1-chalk', 'text-slate-700', 'dark:bg-slate-800', 'dark:text-slate-300');
                outputArea.classList.remove('bg-white', 'text-e1-dark', 'dark:bg-slate-700', 'dark:text-white');
            }

            // Word & Character Count Update
            const textToCount = finalText.trim();
            const words = textToCount ? textToCount.split(/\s+/).length : 0;
            const chars = textToCount.length;
            
            document.getElementById('wordCount').innerText = words;
            document.getElementById('charCount').innerText = chars;
        }

        function clearAll() {
            document.getElementById('studentName').value = '';
            commentBank.forEach(cat => { state[cat.id].selectionIndex = null; });
            activeAccordion = 'general';
            renderAccordions();
            compileReport();
            document.getElementById('studentName').focus();
        }

        function copyReport() {
            const output = document.getElementById('outputReport');
            if (!output.value) return;
            
            output.select();
            document.execCommand('copy');
            
            const btn = document.getElementById('copyBtn');
            const originalHTML = btn.innerHTML;
            
            btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> Copied!`;
            btn.classList.replace('bg-e1-green', 'bg-e1-blue');
            btn.classList.replace('text-e1-dark', 'text-white');
            lucide.createIcons();
            
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.replace('bg-e1-blue', 'bg-e1-green');
                btn.classList.replace('text-white', 'text-e1-dark');
                lucide.createIcons();
            }, 1500);
        }

        window.onload = () => {
            lucide.createIcons();
            fetchComments();
            document.getElementById('studentName').focus();
        };
    </script>
</body>
</html>
