<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English 1 – Comment Maker</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            pink:   { DEFAULT: '#FF6B95' },
            orange: { DEFAULT: '#FF8C42' },
            green:  { DEFAULT: '#00E676' },
            blue:   { DEFAULT: '#2979FF' },
            dark:   { DEFAULT: '#1e293b' },
            chalk:  { DEFAULT: '#f8fafc' },
          },
          fontFamily: {
            fredoka: ['Fredoka', 'sans-serif'],
            nunito:  ['Nunito', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: 'Nunito', sans-serif; }
    h1, h2, h3, .fredoka { font-family: 'Fredoka', sans-serif; }
    .btn { transition: transform 0.1s ease, box-shadow 0.1s ease; }
    .btn:hover  { transform: translate(-2px,-2px); box-shadow: 6px 6px 0px 0px rgba(30,41,59,1); }
    .btn:active { transform: translate(2px,2px);   box-shadow: 2px 2px 0px 0px rgba(30,41,59,1); }
    .score-input { -moz-appearance: textfield; }
    .score-input::-webkit-outer-spin-button,
    .score-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .comment-card { animation: popIn 0.3s cubic-bezier(.18,.89,.32,1.28) both; }
    .comment-card:nth-child(2) { animation-delay: 0.08s; }
    .comment-card:nth-child(3) { animation-delay: 0.16s; }
    @keyframes popIn {
      from { opacity:0; transform: scale(0.88) translateY(10px); }
      to   { opacity:1; transform: scale(1) translateY(0); }
    }
    .student-pill { cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; }
    .student-pill:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0px 0px rgba(30,41,59,1); }
    .hard  { box-shadow: 4px 4px 0px 0px rgba(30,41,59,1); }
    .hard-sm { box-shadow: 2px 2px 0px 0px rgba(30,41,59,1); }
  </style>
</head>
<body class="bg-[#f8fafc] dark:bg-slate-900 min-h-screen transition-colors duration-300">

  <!-- Header -->
  <header class="bg-[#2979FF] border-b-4 border-[#1e293b] px-6 py-4 flex items-center justify-between hard">
    <div class="flex items-center gap-3">
      <div class="bg-[#f8fafc] border-2 border-[#1e293b] rounded-xl p-2 hard-sm">
        <i data-lucide="message-square-text" class="text-[#1e293b]" style="width:26px;height:26px;stroke-width:2.5"></i>
      </div>
      <div>
        <h1 class="text-white fredoka text-2xl font-bold leading-tight">Comment Maker</h1>
        <p class="text-blue-100 text-xs font-semibold tracking-wide">English 1 Batam · Progress Update</p>
      </div>
    </div>
    <button id="darkToggle" class="bg-[#f8fafc] border-2 border-[#1e293b] rounded-xl p-2 hard-sm btn" title="Toggle dark mode">
      <i data-lucide="moon" id="darkIcon" style="width:20px;height:20px;stroke-width:2.5"></i>
    </button>
  </header>

  <div class="max-w-3xl mx-auto px-4 py-6 space-y-5">

    <!-- Student Roster -->
    <section class="bg-white dark:bg-slate-800 border-4 border-[#1e293b] rounded-2xl p-5 hard">
      <div class="flex items-center justify-between mb-3">
        <h2 class="fredoka text-xl font-bold text-[#1e293b] dark:text-[#f8fafc] flex items-center gap-2">
          <i data-lucide="users" style="width:20px;height:20px;stroke-width:2.5;color:#FF8C42"></i>
          Students
          <span id="rosterCount" class="text-sm bg-[#FF8C42]/20 border-2 border-[#1e293b] rounded-lg px-2 py-0.5 font-nunito">0</span>
        </h2>
        <button onclick="addNewStudent()" class="btn bg-[#FF6B95] border-[3px] border-[#1e293b] rounded-xl px-3 py-1.5 fredoka font-bold text-white text-sm hard-sm flex items-center gap-1">
          <i data-lucide="plus" style="width:16px;height:16px;stroke-width:3"></i> Add Student
        </button>
      </div>
      <div id="rosterList" class="flex flex-wrap gap-2 min-h-[38px] items-center">
        <p class="text-slate-400 font-semibold text-sm italic" id="rosterEmpty">No students yet. Click "Add Student" to begin.</p>
      </div>
    </section>

    <!-- Score Input Card -->
    <section class="bg-white dark:bg-slate-800 border-4 border-[#1e293b] rounded-2xl p-6 hard">
      <h2 class="fredoka text-2xl font-bold text-[#1e293b] dark:text-[#f8fafc] mb-4 flex items-center gap-2">
        <i data-lucide="clipboard-list" style="width:24px;height:24px;stroke-width:2.5;color:#2979FF"></i>
        <span id="formTitle">Select or Add a Student</span>
      </h2>

      <!-- Student Name -->
      <div class="mb-4">
        <label class="block fredoka font-semibold text-[#1e293b] dark:text-[#f8fafc] mb-1 text-sm">Student Name</label>
        <input id="studentName" type="text" placeholder="e.g. Aisyah" readonly
          class="w-full border-4 border-[#1e293b] rounded-xl px-4 py-2 fredoka text-lg font-bold bg-[#f8fafc] dark:bg-slate-700 dark:text-[#f8fafc] focus:outline-none cursor-default opacity-70" />
      </div>

      <!-- Score Grid -->
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
        <div class="bg-[#FF6B95]/10 border-2 border-[#1e293b] rounded-xl p-3 hard-sm">
          <label class="fredoka font-semibold text-[#1e293b] dark:text-[#f8fafc] text-sm block mb-1">
            <i data-lucide="hand" style="width:13px;height:13px;stroke-width:2.5;color:#FF6B95;display:inline"></i> Participation
          </label>
          <input id="s_participation" type="number" min="0" max="10" placeholder="–"
            class="score-input w-full border-2 border-[#1e293b] rounded-lg px-2 py-1.5 text-center fredoka text-2xl font-bold bg-white dark:bg-slate-700 dark:text-[#f8fafc] focus:outline-none focus:ring-2 focus:ring-[#FF6B95]" />
        </div>
        <div class="bg-[#FF8C42]/10 border-2 border-[#1e293b] rounded-xl p-3 hard-sm">
          <label class="fredoka font-semibold text-[#1e293b] dark:text-[#f8fafc] text-sm block mb-1">
            <i data-lucide="users" style="width:13px;height:13px;stroke-width:2.5;color:#FF8C42;display:inline"></i> Social
          </label>
          <input id="s_social" type="number" min="0" max="10" placeholder="–"
            class="score-input w-full border-2 border-[#1e293b] rounded-lg px-2 py-1.5 text-center fredoka text-2xl font-bold bg-white dark:bg-slate-700 dark:text-[#f8fafc] focus:outline-none focus:ring-2 focus:ring-[#FF8C42]" />
        </div>
        <div class="bg-[#2979FF]/10 border-2 border-[#1e293b] rounded-xl p-3 hard-sm">
          <label class="fredoka font-semibold text-[#1e293b] dark:text-[#f8fafc] text-sm block mb-1">
            <i data-lucide="ear" style="width:13px;height:13px;stroke-width:2.5;color:#2979FF;display:inline"></i> Listening
          </label>
          <input id="s_listening" type="number" min="0" max="10" placeholder="–"
            class="score-input w-full border-2 border-[#1e293b] rounded-lg px-2 py-1.5 text-center fredoka text-2xl font-bold bg-white dark:bg-slate-700 dark:text-[#f8fafc] focus:outline-none focus:ring-2 focus:ring-[#2979FF]" />
        </div>
        <div class="bg-[#00E676]/10 border-2 border-[#1e293b] rounded-xl p-3 hard-sm">
          <label class="fredoka font-semibold text-[#1e293b] dark:text-[#f8fafc] text-sm block mb-1">
            <i data-lucide="shield-check" style="width:13px;height:13px;stroke-width:2.5;color:#00E676;display:inline"></i> Confidence
          </label>
          <input id="s_confidence" type="number" min="0" max="10" placeholder="–"
            class="score-input w-full border-2 border-[#1e293b] rounded-lg px-2 py-1.5 text-center fredoka text-2xl font-bold bg-white dark:bg-slate-700 dark:text-[#f8fafc] focus:outline-none focus:ring-2 focus:ring-[#00E676]" />
        </div>
        <div class="bg-[#FF6B95]/10 border-2 border-[#1e293b] rounded-xl p-3 hard-sm">
          <label class="fredoka font-semibold text-[#1e293b] dark:text-[#f8fafc] text-sm block mb-1">
            <i data-lucide="mic" style="width:13px;height:13px;stroke-width:2.5;color:#FF6B95;display:inline"></i> Speaking
          </label>
          <input id="s_spoken" type="number" min="0" max="10" placeholder="–"
            class="score-input w-full border-2 border-[#1e293b] rounded-lg px-2 py-1.5 text-center fredoka text-2xl font-bold bg-white dark:bg-slate-700 dark:text-[#f8fafc] focus:outline-none focus:ring-2 focus:ring-[#FF6B95]" />
        </div>
        <div class="bg-[#FF8C42]/10 border-2 border-[#1e293b] rounded-xl p-3 hard-sm">
          <label class="fredoka font-semibold text-[#1e293b] dark:text-[#f8fafc] text-sm block mb-1">
            <i data-lucide="calendar-check" style="width:13px;height:13px;stroke-width:2.5;color:#FF8C42;display:inline"></i> Attendance
          </label>
          <input id="s_attendance" type="number" min="0" max="10" placeholder="–"
            class="score-input w-full border-2 border-[#1e293b] rounded-lg px-2 py-1.5 text-center fredoka text-2xl font-bold bg-white dark:bg-slate-700 dark:text-[#f8fafc] focus:outline-none focus:ring-2 focus:ring-[#FF8C42]" />
        </div>
        <div class="col-span-2 sm:col-span-3 bg-[#2979FF]/10 border-2 border-[#1e293b] rounded-xl p-3 hard-sm">
          <label class="fredoka font-semibold text-[#1e293b] dark:text-[#f8fafc] text-sm block mb-1">
            <i data-lucide="alert-triangle" style="width:13px;height:13px;stroke-width:2.5;color:#2979FF;display:inline"></i>
            Accuracy (Errors)
            <span class="text-xs font-nunito font-normal text-slate-400 ml-1">(10 = very few errors)</span>
          </label>
          <input id="s_errors" type="number" min="0" max="10" placeholder="–"
            class="score-input w-full border-2 border-[#1e293b] rounded-lg px-2 py-1.5 text-center fredoka text-2xl font-bold bg-white dark:bg-slate-700 dark:text-[#f8fafc] focus:outline-none focus:ring-2 focus:ring-[#2979FF]" />
        </div>
      </div>

      <div id="errorBox" class="hidden mt-3 bg-red-100 border-2 border-red-500 rounded-xl p-3 text-red-700 font-semibold text-sm"></div>

      <!-- Buttons -->
      <div class="flex gap-3 mt-5">
        <button id="generateBtn" onclick="saveAndGenerate()"
          class="btn flex-1 bg-[#FF6B95] border-4 border-[#1e293b] rounded-xl py-3 fredoka text-white text-xl font-bold hard flex items-center justify-center gap-2">
          <i data-lucide="sparkles" style="width:20px;height:20px;stroke-width:2.5"></i>
          Save & Generate
        </button>
        <button onclick="deleteCurrentStudent()"
          class="btn bg-slate-200 dark:bg-slate-700 border-4 border-[#1e293b] rounded-xl px-4 py-3 fredoka font-bold text-[#1e293b] dark:text-[#f8fafc] hard">
          <i data-lucide="trash-2" style="width:20px;height:20px;stroke-width:2.5"></i>
        </button>
      </div>
    </section>

    <!-- Output -->
    <section id="outputSection" class="hidden space-y-4">
      <h2 class="fredoka text-2xl font-bold text-[#1e293b] dark:text-[#f8fafc] flex items-center gap-2">
        <i data-lucide="star" style="width:24px;height:24px;stroke-width:2.5;color:#FF8C42"></i>
        <span id="outputName">Comments</span>
      </h2>
      <div id="commentCards" class="space-y-3"></div>
      <button onclick="copyAll()"
        class="btn w-full bg-[#00E676] border-4 border-[#1e293b] rounded-xl py-3 fredoka text-[#1e293b] text-lg font-bold hard flex items-center justify-center gap-2">
        <i data-lucide="copy" style="width:20px;height:20px;stroke-width:2.5"></i>
        Copy Full Comment
      </button>
    </section>

  </div>

  <!-- Add Student Modal -->
  <div id="modal" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 hidden px-4">
    <div class="bg-white dark:bg-slate-800 border-4 border-[#1e293b] rounded-2xl p-6 w-full max-w-sm hard">
      <h3 class="fredoka text-xl font-bold text-[#1e293b] dark:text-[#f8fafc] mb-3">New Student</h3>
      <input id="modalName" type="text" placeholder="Student name…"
        class="w-full border-4 border-[#1e293b] rounded-xl px-4 py-2 fredoka text-lg font-bold bg-[#f8fafc] dark:bg-slate-700 dark:text-[#f8fafc] focus:outline-none mb-4"
        onkeydown="if(event.key==='Enter') confirmAddStudent()" />
      <div class="flex gap-2">
        <button onclick="confirmAddStudent()"
          class="btn flex-1 bg-[#2979FF] border-4 border-[#1e293b] rounded-xl py-2 fredoka font-bold text-white hard-sm">Add</button>
        <button onclick="closeModal()"
          class="btn flex-1 bg-slate-200 dark:bg-slate-600 border-4 border-[#1e293b] rounded-xl py-2 fredoka font-bold text-[#1e293b] dark:text-[#f8fafc] hard-sm">Cancel</button>
      </div>
    </div>
  </div>

<script>
  lucide.createIcons();

  // ── Dark Mode ─────────────────────────────────────────────────────────────
  const darkToggle = document.getElementById('darkToggle');
  if (localStorage.getItem('e1_dark') === '1') {
    document.documentElement.classList.add('dark');
    document.getElementById('darkIcon').setAttribute('data-lucide', 'sun');
    lucide.createIcons();
  }
  darkToggle.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    const isDark = document.documentElement.classList.contains('dark');
    document.getElementById('darkIcon').setAttribute('data-lucide', isDark ? 'sun' : 'moon');
    lucide.createIcons();
    localStorage.setItem('e1_dark', isDark ? '1' : '0');
  });

  // ── State ──────────────────────────────────────────────────────────────────
  let students  = JSON.parse(localStorage.getItem('e1_students') || '[]');
  let currentId = localStorage.getItem('e1_currentId') || null;

  function save() { localStorage.setItem('e1_students', JSON.stringify(students)); }
  function getStudent(id) { return students.find(s => s.id === id) || null; }

  // ── Roster ─────────────────────────────────────────────────────────────────
  function renderRoster() {
    const list  = document.getElementById('rosterList');
    document.getElementById('rosterCount').textContent = students.length;
    list.innerHTML = '';

    if (students.length === 0) {
      list.innerHTML = '<p class="text-slate-400 font-semibold text-sm italic">No students yet. Click "Add Student" to begin.</p>';
      return;
    }

    students.forEach(s => {
      const done = s.scores && Object.values(s.scores).every(v => v !== '' && v !== undefined);
      const isActive = s.id === currentId;
      const pill = document.createElement('button');
      pill.className = 'student-pill border-2 border-[#1e293b] rounded-xl px-3 py-1.5 fredoka font-bold text-sm hard-sm flex items-center gap-1';
      pill.style.background = isActive ? '#2979FF' : (document.documentElement.classList.contains('dark') ? '#334155' : '#f8fafc');
      pill.style.color = isActive ? '#fff' : (document.documentElement.classList.contains('dark') ? '#f8fafc' : '#1e293b');
      pill.innerHTML = `${done ? '<span style="color:#00E676">✓</span>' : ''} ${s.name}`;
      pill.onclick = () => loadStudent(s.id);
      list.appendChild(pill);
    });
  }

  function loadStudent(id) {
    currentId = id;
    localStorage.setItem('e1_currentId', id);
    const s = getStudent(id);
    if (!s) return;

    document.getElementById('studentName').value = s.name;
    document.getElementById('formTitle').textContent = `Scores for ${s.name}`;

    const sc = s.scores || {};
    document.getElementById('s_participation').value = sc.participation ?? '';
    document.getElementById('s_social').value        = sc.social        ?? '';
    document.getElementById('s_listening').value     = sc.listening     ?? '';
    document.getElementById('s_confidence').value    = sc.confidence    ?? '';
    document.getElementById('s_spoken').value        = sc.spoken        ?? '';
    document.getElementById('s_attendance').value    = sc.attendance    ?? '';
    document.getElementById('s_errors').value        = sc.errors        ?? '';

    renderRoster();
    hideError();

    if (s.comments) {
      renderComments(s.name, s.comments);
    } else {
      document.getElementById('outputSection').classList.add('hidden');
    }
  }

  // ── Modal ──────────────────────────────────────────────────────────────────
  function addNewStudent() {
    document.getElementById('modalName').value = '';
    document.getElementById('modal').classList.remove('hidden');
    setTimeout(() => document.getElementById('modalName').focus(), 60);
  }
  function closeModal() {
    document.getElementById('modal').classList.add('hidden');
  }
  function confirmAddStudent() {
    const name = document.getElementById('modalName').value.trim();
    if (!name) return;
    const s = { id: Date.now().toString(), name, scores: {}, comments: null };
    students.push(s);
    save();
    closeModal();
    renderRoster();
    loadStudent(s.id);
  }
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target === document.getElementById('modal')) closeModal();
  });

  // ── Save & Generate ────────────────────────────────────────────────────────
  function saveAndGenerate() {
    if (!currentId) { showError('Please select or add a student first.'); return; }
    const name = document.getElementById('studentName').value.trim();

    const fields = {
      participation: document.getElementById('s_participation').value,
      social:        document.getElementById('s_social').value,
      listening:     document.getElementById('s_listening').value,
      confidence:    document.getElementById('s_confidence').value,
      spoken:        document.getElementById('s_spoken').value,
      attendance:    document.getElementById('s_attendance').value,
      errors:        document.getElementById('s_errors').value,
    };

    const labels = { participation:'Participation', social:'Social', listening:'Listening',
                     confidence:'Confidence', spoken:'Speaking', attendance:'Attendance', errors:'Accuracy (Errors)' };

    for (const [k, v] of Object.entries(fields)) {
      if (v === '' || isNaN(+v)) { showError(`Please enter a score for "${labels[k]}".`); return; }
      if (+v < 0 || +v > 10)    { showError(`"${labels[k]}" must be between 0 and 10.`);  return; }
    }
    hideError();

    const s = getStudent(currentId);
    s.name   = name;
    s.scores = fields;
    s.comments = buildComments(name, fields);
    save();
    renderRoster();
    renderComments(name, s.comments);
  }

  function deleteCurrentStudent() {
    if (!currentId) return;
    if (!confirm('Delete this student and their scores?')) return;
    students = students.filter(s => s.id !== currentId);
    currentId = null;
    localStorage.removeItem('e1_currentId');
    save();
    renderRoster();
    clearForm();
    document.getElementById('outputSection').classList.add('hidden');
  }

  function clearForm() {
    document.getElementById('studentName').value = '';
    document.getElementById('formTitle').textContent = 'Select or Add a Student';
    ['s_participation','s_social','s_listening','s_confidence','s_spoken','s_attendance','s_errors']
      .forEach(id => { document.getElementById(id).value = ''; });
  }

  // ── Comment Engine ─────────────────────────────────────────────────────────
  function level(v) {
    v = +v;
    if (v >= 9) return 'excellent';
    if (v >= 7) return 'good';
    if (v >= 5) return 'developing';
    return 'needs_work';
  }

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // Short, hopeful phrases for the new Skill Breakdown format (4 options, 3 sentences each)
  const hopefulPhrases = {
    participation: {
      excellent: [
        "Always brings bright energy to our classroom. They participate fully in every single activity. It's wonderful to see such enthusiasm for learning!",
        "Eagerly joins in all our class discussions. They are always ready to share great ideas. I love their active role in our classroom.",
        "Throws themselves into every task with a big smile. They are a true star when it comes to participating. This positive energy makes the class so much fun.",
        "Consistently raises their hand to answer questions. They are always involved in our daily activities. Their eagerness to learn is fantastic to watch."
      ],
      good: [
        "Doing a wonderful job joining in our daily activities. They are showing great interest in the lessons. I'm proud of their steady effort.",
        "Often participates well during our group tasks. They bring good ideas to the classroom. It is great to see them engaged and learning.",
        "Shows steady involvement in most of our class work. They are usually happy to share their thoughts. Keep up this wonderful participation.",
        "Takes an active part in our daily lessons. They are doing well at joining in with friends. I am happy with their consistent effort."
      ],
      developing: [
        "Making great steps in joining class activities. They are starting to share more ideas with us. I encourage them to keep raising their hand.",
        "Slowly becoming more active in our lessons. They are finding the courage to participate more often. I know they have great things to share.",
        "Beginning to show more interest during class tasks. They are taking small but important steps to join in. Let's keep building this wonderful habit.",
        "Starting to engage more with our daily activities. They are learning to speak up during group time. I am excited to see them grow further."
      ],
      needs_work: [
        "I believe they will find their voice and participate even more. Taking small steps to join in will help a lot. I'm excited to see their confidence grow here.",
        "They have so many wonderful ideas waiting to be shared. Joining in just a little more will make learning so much fun. I am always here to help them participate.",
        "Let's work together on raising our hand more often. They are capable of doing amazing things in class. I know they can become a bright participant.",
        "I would love to see them jump into activities more. Taking part makes the lessons much more exciting. They will do great once they start joining in."
      ]
    },
    social: {
      excellent: [
        "A fantastic team player who always lifts everyone up. They work wonderfully with all of their classmates. Their kindness makes the classroom a better place.",
        "Always treats friends with kindness and respect. They are incredibly helpful during our group activities. Everyone loves having them on their team.",
        "A true friend to everyone in the classroom. They share nicely and play beautifully with others. It is a joy to see their warm heart.",
        "Brilliant at making sure everyone feels included. They are highly cooperative during all team tasks. Their social skills are truly outstanding."
      ],
      good: [
        "Works very nicely with all classmates during group tasks. They are always polite and friendly to others. It is great to see them building good relationships.",
        "Plays well with friends and shares their things. They are a kind and caring classmate. Keep being this wonderful friend.",
        "Gets along well with peers during most activities. They are learning how to be a supportive teammate. I am glad to see their friendly nature.",
        "Cooperates easily with others in the classroom. They show good manners when working together. It is lovely to see them smile with friends."
      ],
      developing: [
        "Growing more comfortable working with friends in class. They are learning how to share and take turns nicely. With more practice, they will be great team players.",
        "Starting to interact more warmly with classmates. They are slowly building better friendships every day. Keep practicing those friendly hellos.",
        "Making good progress in playing together with others. They are learning how to listen to friends' ideas. These social skills will keep getting stronger.",
        "Beginning to join group activities more comfortably. They are finding it easier to work alongside friends. I am proud of these positive social steps."
      ],
      needs_work: [

  function buildComments(name, sc) {
    const labels = { participation:'Participation', social:'Social', listening:'Listening', confidence:'Confidence', spoken:'Speaking', attendance:'Attendance', errors:'Accuracy' };
    let skillBreakdown = `Here is ${name}'s progress across all skills:\n\n`;
    for (const [k, v] of Object.entries(sc)) {
      skillBreakdown += `• ${labels[k]}:\n  ${pick(hopefulPhrases[k][level(v)])}\n\n`;
    }
    skillBreakdown += `Keep up the great work!`;

    return [skillBreakdown.trim()];
  }

  // ── Render Comments ────────────────────────────────────────────────────────
  let lastComments = [];

  const styleConfig = [
    { label:'Skill Breakdown (Hopeful)', icon:'list-checks', color:'#00E676' }
  ];

  function renderComments(name, comments) {
    lastComments = comments;
    document.getElementById('outputName').textContent = `Comments for ${name}`;
    const container = document.getElementById('commentCards');
    container.innerHTML = '';

    comments.forEach((text, i) => {
      const cfg = styleConfig[i];
      const card = document.createElement('div');
      card.className = 'comment-card border-4 border-[#1e293b] rounded-2xl p-4 hard';
      card.style.background = cfg.color + '18';
      // Added whitespace-pre-wrap to the paragraph so \n line breaks render properly
      card.innerHTML = `
        <div class="flex items-center justify-between mb-2">
          <span class="fredoka font-bold text-sm px-3 py-1 rounded-lg border-2 border-[#1e293b] text-white flex items-center gap-1 hard-sm"
                style="background:${cfg.color}">
            <i data-lucide="${cfg.icon}" style="width:13px;height:13px;stroke-width:2.5"></i>
            ${cfg.label}
          </span>
          <button onclick="copyOne(${i})" title="Copy this comment"
            class="btn bg-white dark:bg-slate-700 border-2 border-[#1e293b] rounded-lg p-1.5 hard-sm">
            <i data-lucide="copy" style="width:16px;height:16px;stroke-width:2.5"></i>
          </button>
        </div>
        <p class="text-[#1e293b] dark:text-[#f8fafc] font-semibold leading-relaxed whitespace-pre-wrap">${text}</p>
      `;
      container.appendChild(card);
    });

    lucide.createIcons();
    document.getElementById('outputSection').classList.remove('hidden');
    document.getElementById('outputSection').scrollIntoView({ behavior:'smooth', block:'start' });
  }

  function copyOne(i) {
    navigator.clipboard.writeText(lastComments[i]).then(() => showToast('Copied!'));
  }
  function copyAll() {
    navigator.clipboard.writeText(lastComments[0]).then(() => showToast('Comment copied!'));
  }

  function showToast(msg) {
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#00E676;border:4px solid #1e293b;border-radius:12px;padding:10px 24px;font-family:Fredoka,sans-serif;font-weight:700;font-size:18px;color:#1e293b;box-shadow:4px 4px 0px 0px rgba(30,41,59,1);z-index:9999';
    t.textContent = '✓ ' + msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
  }

  function showError(msg) {
    const box = document.getElementById('errorBox');
    box.textContent = '⚠ ' + msg;
    box.classList.remove('hidden');
  }
  function hideError() {
    document.getElementById('errorBox').classList.add('hidden');
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  renderRoster();
  if (currentId && getStudent(currentId)) {
    loadStudent(currentId);
  } else if (students.length > 0) {
    loadStudent(students[0].id);
